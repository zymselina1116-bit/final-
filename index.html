<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantern Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
        }

        canvas {
            display: block;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #drawingInterface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        #drawingInterface.active {
            display: flex;
        }

        #drawingCanvas {
            background: white;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(255, 220, 83, 0.3);
        }

        .draw-button {
            margin-top: 30px;
            padding: 15px 50px;
            background: #FFDC53;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #000;
            letter-spacing: 1px;
        }

        .draw-button:hover {
            background: #FFE680;
        }

        /* Choice Menu */
        #choiceMenu {
            position: absolute;
            display: none;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #FFDC53;
            border-radius: 8px;
            z-index: 50;
        }

        #choiceMenu.active {
            display: flex;
        }

        .choice-title {
            color: #FFFCF1;
            font-size: 14px;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .choice-button {
            padding: 12px 25px;
            background: transparent;
            border: 2px solid #FFDC53;
            color: #FFFCF1;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .choice-button:hover {
            background: #FFDC53;
            color: #000;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .color-choice {
            padding: 10px 15px;
            background: transparent;
            border: 2px solid #FFDC53;
            color: #FFFCF1;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.2s;
        }

        .color-choice:hover {
            background: #FFDC53;
            color: #000;
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>

    <!-- Choice Menu -->
    <div id="choiceMenu">
        <div id="choiceContent"></div>
    </div>

    <div id="drawingInterface">
        <canvas id="drawingCanvas" width="300" height="300"></canvas>
        <button class="draw-button" onclick="app.finishDrawing()">Create Lantern</button>
    </div>

    <script>
        const app = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,

            // Drawing
            drawingCanvas: null,
            drawingCtx: null,
            isDrawing: false,
            drawingPoints: [],

            // Lanterns
            lanterns: [],
            activeLantern: null,
            focusedLantern: null,
            pendingLanternType: null,

            // Interaction
            isDragging: false,
            dragMode: null,
            lastMouseX: 0,
            lastMouseY: 0,

            // Animation
            time: 0,

            // Colors
            colors: {
                wall: '#FFFCF1',
                table: '#B5AB9C',
                tableDark: '#9A907F',
                lanternGold: '#FFDC53'
            },


            getTablePolygon() {
                const w = this.width;
                const h = this.height;
                return [
                    { x: w * 0.05, y: h * 0.62 },
                    { x: w * 0.35, y: h * 0.62 },
                    { x: w * 0.45, y: h * 0.95 },
                    { x: 0, y: h * 0.95 }
                ];
            },

            init() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.drawingCanvas = document.getElementById('drawingCanvas');
                this.drawingCtx = this.drawingCanvas.getContext('2d');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.setupEventListeners();
                this.animate();
            },

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            },

            setupEventListeners() {
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
                this.canvas.addEventListener('dblclick', (e) => this.handleDoubleClick(e));

                this.drawingCanvas.addEventListener('mousedown', (e) => {
                    this.isDrawing = true;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints = [{
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    }];
                });

                this.drawingCanvas.addEventListener('mousemove', (e) => {
                    if (!this.isDrawing) return;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints.push({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                    this.updateDrawing();
                });

                this.drawingCanvas.addEventListener('mouseup', () => {
                    this.isDrawing = false;
                });
            },

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check glowing dot
                const polygon = this.getTablePolygon();
                const dotX = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const dotY = polygon[3].y - 40;
                const dist = Math.sqrt((x - dotX) ** 2 + (y - dotY) ** 2);

                if (dist < 20 && !this.focusedLantern) {
                    document.getElementById('drawingInterface').classList.add('active');
                    return;
                }

                // Check lanterns
                for (let lantern of this.lanterns) {
                    const lDist = Math.sqrt((x - lantern.x) ** 2 + (y - lantern.y) ** 2);
                    if (lDist < 80) {
                        this.activeLantern = lantern;
                        this.isDragging = true;
                        this.dragMode = 'rotate';
                        this.lastMouseX = x;
                        this.lastMouseY = y;
                        return;
                    }
                }
            },

            handleMouseMove(e) {
                if (!this.isDragging || !this.activeLantern) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const deltaX = x - this.lastMouseX;
                const deltaY = y - this.lastMouseY;

                // Check if movement is more horizontal (rotate) or general (move)
                if (Math.abs(deltaX) > Math.abs(deltaY) * 2 && this.dragMode === 'rotate') {
                    // Horizontal drag = rotation
                    this.activeLantern.rotation += deltaX * 0.02;
                    this.activeLantern.rotationSpeed = deltaX * 0.02;
                } else {
                    // Free movement in all directions
                    this.activeLantern.x += deltaX;
                    this.activeLantern.y += deltaY;
                }

                this.lastMouseX = x;
                this.lastMouseY = y;
            },

            handleMouseUp() {
                this.isDragging = false;
                this.dragMode = null;
                this.activeLantern = null;
            },

            handleDoubleClick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (this.focusedLantern) {
                    // Zoom out
                    this.focusedLantern = null;
                    return;
                }

                // Check if double-clicking on a lantern
                for (let lantern of this.lanterns) {
                    const lDist = Math.sqrt((x - lantern.x) ** 2 + (y - lantern.y) ** 2);
                    if (lDist < 80) {
                        this.focusedLantern = lantern;
                        return;
                    }
                }
            },


            updateDrawing() {
                const ctx = this.drawingCtx;
                ctx.clearRect(0, 0, 300, 300);

                if (this.drawingPoints.length < 2) return;

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.moveTo(this.drawingPoints[0].x, this.drawingPoints[0].y);

                for (let i = 1; i < this.drawingPoints.length; i++) {
                    ctx.lineTo(this.drawingPoints[i].x, this.drawingPoints[i].y);
                }

                ctx.closePath();
                ctx.fill();
            },

            finishDrawing() {
                if (this.drawingPoints.length < 3) return;

                const silhouetteCanvas = document.createElement('canvas');
                silhouetteCanvas.width = 300;
                silhouetteCanvas.height = 300;
                const sCtx = silhouetteCanvas.getContext('2d');
                sCtx.drawImage(this.drawingCanvas, 0, 0);

                const polygon = this.getTablePolygon();
                const dotX = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const dotY = polygon[3].y - 40;

                this.lanterns.push({
                    type: 'carousel',
                    x: dotX,
                    y: dotY - 80,
                    rotation: 0,
                    rotationSpeed: 0,
                    silhouette: silhouetteCanvas,
                    height: 100,
                    glowColor: '#FFFAED'
                });

                document.getElementById('drawingInterface').classList.remove('active');
                this.drawingCtx.clearRect(0, 0, 300, 300);
                this.drawingPoints = [];
            },

            animate() {
                this.time += 0.016;

                this.ctx.clearRect(0, 0, this.width, this.height);

                if (this.focusedLantern) {
                    this.renderFocusedView();
                } else {
                    this.renderRoom();
                    this.renderShadows();
                    this.renderLanterns();
                    this.renderGlowingDot();
                    this.renderDarkOverlay();
                }

                this.updatePhysics();

                requestAnimationFrame(() => this.animate());
            },

            renderRoom() {
                const ctx = this.ctx;

                ctx.fillStyle = this.colors.wall;
                ctx.fillRect(0, 0, this.width, this.height);

                const polygon = this.getTablePolygon();

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                for (let i = 1; i < polygon.length; i++) {
                    ctx.lineTo(polygon[i].x, polygon[i].y);
                }
                ctx.closePath();

                const tableGradient = ctx.createLinearGradient(0, polygon[0].y, 0, polygon[3].y);
                tableGradient.addColorStop(0, '#C8BFB0');
                tableGradient.addColorStop(0.4, this.colors.table);
                tableGradient.addColorStop(1, '#7A7060');

                ctx.fillStyle = tableGradient;
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 252, 241, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                ctx.lineTo(polygon[1].x, polygon[1].y);
                ctx.stroke();

                ctx.restore();
            },

            renderShadows() {
                const ctx = this.ctx;
                const wallX = this.width * 0.5;

                for (let lantern of this.lanterns) {
                    this.renderCarouselShadows(lantern, wallX);
                }
            },

            renderCarouselShadows(lantern, wallX) {
                const ctx = this.ctx;
                const candleX = lantern.x;
                const candleY = lantern.y + lantern.height;

                // Render individual charm shadows (6-petal pattern)
                for (let i = 0; i < 6; i++) {
                    const angle = lantern.rotation + (i / 6) * Math.PI * 2;
                    const charmX = lantern.x + Math.cos(angle) * 38;
                    const charmY = lantern.y + Math.sin(angle) * 38 * 0.3 + 60;

                    const dx = charmX - candleX;
                    const dy = charmY - candleY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const shadowDist = 280;
                    const shadowX = wallX + (dx / dist) * shadowDist;
                    const shadowY = this.height * 0.4 + (dy / dist) * shadowDist * 0.4;

                    // Crisp shadow with reduced blur (10px)
                    ctx.save();
                    ctx.globalAlpha = 0.45;
                    ctx.filter = 'blur(10px)';

                    ctx.translate(shadowX, shadowY);
                    ctx.rotate(lantern.rotation + (i / 6) * Math.PI * 2);
                    ctx.scale(0.18, 0.18);
                    ctx.translate(-150, -150);

                    ctx.drawImage(lantern.silhouette, 0, 0);

                    ctx.restore();
                }
            },


            renderLanterns() {
                for (let lantern of this.lanterns) {
                    this.renderCandle(lantern.x, lantern.y + lantern.height, lantern.glowColor);
                    this.renderCarouselLantern(lantern);
                }
            },

            renderCarouselLantern(lantern) {
                const ctx = this.ctx;
                const x = lantern.x;
                const y = lantern.y;

                // Base (gold with micro-3D)
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;
                ctx.fillStyle = this.colors.lanternGold;
                ctx.beginPath();
                ctx.arc(x, y + lantern.height, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Highlight on base
                ctx.fillStyle = 'rgba(255, 255, 200, 0.4)';
                ctx.beginPath();
                ctx.arc(x - 3, y + lantern.height - 3, 8, 0, Math.PI * 2);
                ctx.fill();

                // Vertical stand (static, doesn't rotate)
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(x, y + lantern.height);
                ctx.lineTo(x, y);
                ctx.stroke();

                // Inner shadow on stand
                ctx.strokeStyle = 'rgba(200, 160, 30, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x + 1, y + lantern.height);
                ctx.lineTo(x + 1, y);
                ctx.stroke();

                // Top ring (elliptical perspective - rotates)
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1, 0.3);

                // Outer ring
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 50, 0, Math.PI * 2);
                ctx.stroke();

                // Inner shadow
                ctx.strokeStyle = 'rgba(200, 160, 30, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, 48, 0, Math.PI * 2);
                ctx.stroke();

                // Inner ring
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 45, 0, Math.PI * 2);
                ctx.stroke();

                // Highlight arc
                ctx.strokeStyle = 'rgba(255, 255, 200, 0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 50, Math.PI * 1.2, Math.PI * 1.5);
                ctx.stroke();

                ctx.restore();

                // 6 charms (rotate with ring)
                for (let i = 0; i < 6; i++) {
                    const angle = lantern.rotation + (i / 6) * Math.PI * 2;
                    const mountX = x + Math.cos(angle) * 38;
                    const mountY = y + Math.sin(angle) * 38 * 0.3;
                    const charmX = mountX;
                    const charmY = y + 60;

                    // Wire
                    ctx.strokeStyle = 'rgba(200, 180, 120, 0.9)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(mountX, mountY);
                    ctx.lineTo(charmX, charmY);
                    ctx.stroke();

                    // Charm
                    ctx.save();
                    ctx.translate(charmX, charmY);
                    ctx.scale(0.08, 0.08);
                    ctx.translate(-150, -150);
                    ctx.drawImage(lantern.silhouette, 0, 0);
                    ctx.restore();
                }
            },


            renderCandle(x, y, glowColor) {
                const ctx = this.ctx;
                const pulse = Math.sin(this.time * 4) * 0.08 + 0.92;

                // Candle glow
                ctx.save();
                ctx.globalAlpha = 0.35 * pulse;
                ctx.filter = 'blur(30px)';
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 70);
                gradient.addColorStop(0, glowColor);
                gradient.addColorStop(1, 'rgba(255, 220, 83, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(x - 70, y - 70, 140, 140);
                ctx.restore();

                // Candle body
                ctx.fillStyle = '#E8D5B7';
                ctx.fillRect(x - 4, y - 5, 8, 15);

                // Candle shadow
                ctx.fillStyle = 'rgba(150, 130, 100, 0.3)';
                ctx.fillRect(x - 3, y - 5, 1, 15);

                // Flame
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.ellipse(x, y - 8, 3, 5 * pulse, 0, 0, Math.PI * 2);
                ctx.fill();

                // Flame highlight
                ctx.fillStyle = '#FFF8DC';
                ctx.beginPath();
                ctx.ellipse(x - 1, y - 9, 1.5, 2.5 * pulse, 0, 0, Math.PI * 2);
                ctx.fill();
            },

            renderGlowingDot() {
                const ctx = this.ctx;
                const polygon = this.getTablePolygon();
                const x = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const y = polygon[3].y - 40;

                const pulse = Math.sin(this.time * 2) * 0.5 + 0.5;

                for (let i = 0; i < 3; i++) {
                    const phase = (this.time * 1.5 + i * 0.4) % 1;
                    const radius = 10 + phase * 30;
                    const alpha = (1 - phase) * 0.4;

                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(255, 255, 255, ${0.8 + pulse * 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            },

            renderDarkOverlay() {
                const ctx = this.ctx;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.20)';
                ctx.fillRect(0, 0, this.width, this.height);
            },

            renderFocusedView() {
                const lantern = this.focusedLantern;

                // Dark background
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Render only this lantern and its shadow
                const centerX = this.width * 0.3;
                const centerY = this.height * 0.5;

                this.ctx.save();
                this.ctx.translate(centerX - lantern.x, centerY - lantern.y);

                // Shadow
                const wallX = this.width * 0.65;
                this.renderCarouselShadows(lantern, wallX);

                // Lantern
                this.renderCandle(lantern.x, lantern.y + lantern.height, lantern.glowColor);
                this.renderCarouselLantern(lantern);

                this.ctx.restore();

                // Instructions
                this.ctx.fillStyle = 'rgba(255, 252, 241, 0.7)';
                this.ctx.font = '14px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('Double-click anywhere to return', this.width / 2, this.height - 40);
            },

            updatePhysics() {
                for (let lantern of this.lanterns) {
                    lantern.rotation += lantern.rotationSpeed;
                    lantern.rotationSpeed *= 0.94;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
