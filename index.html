<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantern Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #drawingInterface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        #drawingInterface.active {
            display: flex;
        }

        #drawingCanvas {
            background: white;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(255, 220, 83, 0.3);
        }

        .draw-button {
            margin-top: 30px;
            padding: 15px 50px;
            background: #FFDC53;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #000;
            letter-spacing: 1px;
        }

        .draw-button:hover {
            background: #FFE680;
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>

    <div id="drawingInterface">
        <canvas id="drawingCanvas" width="300" height="300"></canvas>
        <button class="draw-button" onclick="app.finishDrawing()">Create Lantern</button>
    </div>

    <script>
        const app = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,

            // Drawing
            drawingCanvas: null,
            drawingCtx: null,
            isDrawing: false,
            drawingPoints: [],
            currentSilhouette: null,

            // Lanterns
            lanterns: [],
            activeLantern: null,

            // Interaction
            isDragging: false,
            isRotating: false,
            lastMouseX: 0,

            // Animation
            time: 0,

            // Colors
            colors: {
                wall: '#FFFCF1',
                table: '#B5AB9C',
                tableDark: '#9A907F',
                lanternGold: '#FFDC53'
            },

            init() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.drawingCanvas = document.getElementById('drawingCanvas');
                this.drawingCtx = this.drawingCanvas.getContext('2d');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.setupEventListeners();
                this.animate();
            },

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            },

            setupEventListeners() {
                // Main canvas
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());

                // Drawing canvas
                this.drawingCanvas.addEventListener('mousedown', (e) => {
                    this.isDrawing = true;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints = [{
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    }];
                });

                this.drawingCanvas.addEventListener('mousemove', (e) => {
                    if (!this.isDrawing) return;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints.push({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                    this.updateDrawing();
                });

                this.drawingCanvas.addEventListener('mouseup', () => {
                    this.isDrawing = false;
                });
            },

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check glowing dot (add button)
                const dotX = this.width * 0.12;
                const dotY = this.height * 0.75;
                const dist = Math.sqrt((x - dotX) ** 2 + (y - dotY) ** 2);

                if (dist < 20) {
                    document.getElementById('drawingInterface').classList.add('active');
                    return;
                }

                // Check lanterns
                for (let lantern of this.lanterns) {
                    const lDist = Math.sqrt((x - lantern.x) ** 2 + (y - lantern.y) ** 2);
                    if (lDist < 80) {
                        this.activeLantern = lantern;
                        this.isDragging = true;
                        this.lastMouseX = x;
                        return;
                    }
                }
            },

            handleMouseMove(e) {
                if (!this.isDragging || !this.activeLantern) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const deltaX = x - this.lastMouseX;

                // Determine if rotating or repositioning
                if (Math.abs(deltaX) > 2) {
                    this.isRotating = true;
                }

                if (this.isRotating) {
                    // Rotate lantern
                    this.activeLantern.rotation += deltaX * 0.02;
                    this.activeLantern.rotationSpeed = deltaX * 0.02;
                } else {
                    // Reposition lantern
                    this.activeLantern.x = x;
                }

                this.lastMouseX = x;
            },

            handleMouseUp() {
                this.isDragging = false;
                this.isRotating = false;
                this.activeLantern = null;
            },

            updateDrawing() {
                const ctx = this.drawingCtx;
                ctx.clearRect(0, 0, 300, 300);

                if (this.drawingPoints.length < 2) return;

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.moveTo(this.drawingPoints[0].x, this.drawingPoints[0].y);

                for (let i = 1; i < this.drawingPoints.length; i++) {
                    ctx.lineTo(this.drawingPoints[i].x, this.drawingPoints[i].y);
                }

                ctx.closePath();
                ctx.fill();
            },

            finishDrawing() {
                if (this.drawingPoints.length < 3) return;

                // Capture silhouette
                const silhouetteCanvas = document.createElement('canvas');
                silhouetteCanvas.width = 300;
                silhouetteCanvas.height = 300;
                const sCtx = silhouetteCanvas.getContext('2d');
                sCtx.drawImage(this.drawingCanvas, 0, 0);

                // Create lantern
                const tableY = this.height * 0.65;
                const randomHeight = -80 + Math.random() * 40;

                this.lanterns.push({
                    x: this.width * 0.15 + Math.random() * (this.width * 0.2),
                    y: tableY + randomHeight,
                    rotation: 0,
                    rotationSpeed: 0,
                    silhouette: silhouetteCanvas,
                    height: 120 + Math.random() * 40
                });

                // Close drawing interface
                document.getElementById('drawingInterface').classList.remove('active');

                // Clear drawing
                this.drawingCtx.clearRect(0, 0, 300, 300);
                this.drawingPoints = [];
            },

            animate() {
                this.time += 0.016;

                // Clear
                this.ctx.clearRect(0, 0, this.width, this.height);

                // Render scene
                this.renderRoom();
                this.renderShadows();
                this.renderLanterns();
                this.renderGlowingDot();

                // Update physics
                this.updatePhysics();

                requestAnimationFrame(() => this.animate());
            },

            renderRoom() {
                const ctx = this.ctx;
                const splitX = this.width * 0.5;

                // Wall (right side) - flat color
                ctx.fillStyle = this.colors.wall;
                ctx.fillRect(splitX, 0, this.width - splitX, this.height);

                // Table (left side) - subtle vertical gradient
                const tableTop = this.height * 0.65;
                const gradient = ctx.createLinearGradient(0, tableTop, 0, this.height);
                gradient.addColorStop(0, this.colors.table);
                gradient.addColorStop(1, this.colors.tableDark);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, tableTop, splitX, this.height - tableTop);

                // Floor/background above table
                ctx.fillStyle = '#A8A199';
                ctx.fillRect(0, 0, splitX, tableTop);
            },

            renderShadows() {
                const ctx = this.ctx;
                const wallX = this.width * 0.52;

                // Render all shadows with overlap
                for (let lantern of this.lanterns) {
                    this.renderSingleShadow(lantern, wallX);
                }
            },

            renderSingleShadow(lantern, wallX) {
                const ctx = this.ctx;

                // Shadow position calculation
                // Lantern moves left → shadow moves right (opposite)
                const lanternRelX = lantern.x / (this.width * 0.5);
                const shadowOffsetX = (0.5 - lanternRelX) * 200;
                const shadowX = wallX + 200 + shadowOffsetX;
                const shadowY = this.height * 0.4;

                // Shadow scale (1.8x to 2.2x)
                const shadowScale = 2.0;

                // Render shadow with heavy blur
                ctx.save();
                ctx.globalAlpha = 0.25;
                ctx.filter = 'blur(80px)';

                ctx.translate(shadowX, shadowY);
                ctx.rotate(lantern.rotation);
                ctx.scale(shadowScale * 0.3, shadowScale * 0.3);
                ctx.translate(-150, -150);

                ctx.drawImage(lantern.silhouette, 0, 0);

                ctx.restore();
            },

            renderLanterns() {
                for (let lantern of this.lanterns) {
                    this.renderDiptyqueLantern(lantern);
                }
            },

            renderDiptyqueLantern(lantern) {
                const ctx = this.ctx;
                const x = lantern.x;
                const y = lantern.y;

                // Drop shadow beneath base
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.filter = 'blur(15px)';
                ctx.beginPath();
                ctx.ellipse(x, y + lantern.height + 10, 25, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Base circle
                ctx.fillStyle = this.colors.lanternGold;
                ctx.beginPath();
                ctx.arc(x, y + lantern.height, 15, 0, Math.PI * 2);
                ctx.fill();

                // Vertical stand
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + lantern.height);
                ctx.lineTo(x, y);
                ctx.stroke();

                // Top circular plate
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 50, 0, Math.PI * 2);
                ctx.stroke();

                // Inner circle detail
                ctx.beginPath();
                ctx.arc(x, y, 45, 0, Math.PI * 2);
                ctx.stroke();

                // 6 hanging wires with silhouette charms
                for (let i = 0; i < 6; i++) {
                    const angle = lantern.rotation + (i / 6) * Math.PI * 2;
                    const wireX = x + Math.cos(angle) * 42;
                    const wireY = y + Math.sin(angle) * 42;
                    const charmY = wireY + 60;

                    // Wire
                    ctx.strokeStyle = this.colors.lanternGold;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(wireX, wireY);
                    ctx.lineTo(wireX, charmY);
                    ctx.stroke();

                    // Charm (flat black silhouette)
                    ctx.save();
                    ctx.translate(wireX, charmY);
                    ctx.scale(0.08, 0.08);
                    ctx.translate(-150, -150);
                    ctx.drawImage(lantern.silhouette, 0, 0);
                    ctx.restore();
                }
            },

            renderGlowingDot() {
                const ctx = this.ctx;
                const x = this.width * 0.12;
                const y = this.height * 0.75;

                // Pulsating halo
                const pulse = Math.sin(this.time * 2) * 0.5 + 0.5;

                // Outer ripples
                for (let i = 0; i < 3; i++) {
                    const phase = (this.time * 1.5 + i * 0.4) % 1;
                    const radius = 10 + phase * 30;
                    const alpha = (1 - phase) * 0.4;

                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Center dot
                ctx.fillStyle = `rgba(255, 255, 255, ${0.8 + pulse * 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            },

            updatePhysics() {
                for (let lantern of this.lanterns) {
                    // Apply rotation speed and ease to stop
                    lantern.rotation += lantern.rotationSpeed;
                    lantern.rotationSpeed *= 0.94;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
