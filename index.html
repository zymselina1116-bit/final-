<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantern Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #drawingInterface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        #drawingInterface.active {
            display: flex;
        }

        #drawingCanvas {
            background: white;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(255, 220, 83, 0.3);
        }

        .draw-button {
            margin-top: 30px;
            padding: 15px 50px;
            background: #FFDC53;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #000;
            letter-spacing: 1px;
        }

        .draw-button:hover {
            background: #FFE680;
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>

    <div id="drawingInterface">
        <canvas id="drawingCanvas" width="300" height="300"></canvas>
        <button class="draw-button" onclick="app.finishDrawing()">Create Lantern</button>
    </div>

    <script>
        const app = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,

            // Drawing
            drawingCanvas: null,
            drawingCtx: null,
            isDrawing: false,
            drawingPoints: [],
            currentSilhouette: null,

            // Lanterns
            lanterns: [],
            activeLantern: null,

            // Interaction
            isDragging: false,
            isRotating: false,
            dragMode: null, // 'rotate' or 'move'
            lastMouseX: 0,
            lastMouseY: 0,

            // Animation
            time: 0,

            // Colors
            colors: {
                wall: '#FFFCF1',
                table: '#B5AB9C',
                tableDark: '#9A907F',
                lanternGold: '#FFDC53'
            },

            // Perspective tabletop polygon
            getTablePolygon() {
                // Trapezoid with perspective: wider at front (bottom), narrower at back
                const w = this.width;
                const h = this.height;
                return [
                    { x: w * 0.05, y: h * 0.62 },  // Top-left (back-left)
                    { x: w * 0.35, y: h * 0.62 },  // Top-right (back-right)
                    { x: w * 0.45, y: h * 0.95 },  // Bottom-right (front-right)
                    { x: 0, y: h * 0.95 }           // Bottom-left (front-left)
                ];
            },

            init() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.drawingCanvas = document.getElementById('drawingCanvas');
                this.drawingCtx = this.drawingCanvas.getContext('2d');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.setupEventListeners();
                this.animate();
            },

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            },

            setupEventListeners() {
                // Main canvas
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());

                // Drawing canvas
                this.drawingCanvas.addEventListener('mousedown', (e) => {
                    this.isDrawing = true;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints = [{
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    }];
                });

                this.drawingCanvas.addEventListener('mousemove', (e) => {
                    if (!this.isDrawing) return;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints.push({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                    this.updateDrawing();
                });

                this.drawingCanvas.addEventListener('mouseup', () => {
                    this.isDrawing = false;
                });
            },

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check glowing dot (add button) - position on table
                const polygon = this.getTablePolygon();
                const dotX = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const dotY = polygon[3].y - 40;
                const dist = Math.sqrt((x - dotX) ** 2 + (y - dotY) ** 2);

                if (dist < 20) {
                    document.getElementById('drawingInterface').classList.add('active');
                    return;
                }

                // Check lanterns - determine if clicking base (move) or top (rotate)
                for (let lantern of this.lanterns) {
                    const baseY = lantern.y + lantern.height;
                    const topY = lantern.y;

                    // Check if clicking on base area (bottom third)
                    const baseDistY = Math.abs(y - baseY);
                    const baseDistX = Math.abs(x - lantern.x);

                    if (baseDistX < 40 && baseDistY < 40 && y > topY + lantern.height * 0.6) {
                        // Clicking base - enable repositioning
                        this.activeLantern = lantern;
                        this.isDragging = true;
                        this.dragMode = 'move';
                        this.lastMouseX = x;
                        this.lastMouseY = y;
                        return;
                    }

                    // Check if clicking on top carousel area (for rotation)
                    const topDist = Math.sqrt((x - lantern.x) ** 2 + (y - lantern.y) ** 2);
                    if (topDist < 80) {
                        this.activeLantern = lantern;
                        this.isDragging = true;
                        this.dragMode = 'rotate';
                        this.lastMouseX = x;
                        this.lastMouseY = y;
                        return;
                    }
                }
            },

            handleMouseMove(e) {
                if (!this.isDragging || !this.activeLantern) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const deltaX = x - this.lastMouseX;

                if (this.dragMode === 'rotate') {
                    // Rotate lantern (position stays fixed)
                    this.activeLantern.rotation += deltaX * 0.02;
                    this.activeLantern.rotationSpeed = deltaX * 0.02;
                } else if (this.dragMode === 'move') {
                    // Reposition lantern (only horizontal movement)
                    this.activeLantern.x = x;
                }

                this.lastMouseX = x;
                this.lastMouseY = y;
            },

            handleMouseUp() {
                this.isDragging = false;
                this.isRotating = false;
                this.dragMode = null;
                this.activeLantern = null;
            },

            updateDrawing() {
                const ctx = this.drawingCtx;
                ctx.clearRect(0, 0, 300, 300);

                if (this.drawingPoints.length < 2) return;

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.moveTo(this.drawingPoints[0].x, this.drawingPoints[0].y);

                for (let i = 1; i < this.drawingPoints.length; i++) {
                    ctx.lineTo(this.drawingPoints[i].x, this.drawingPoints[i].y);
                }

                ctx.closePath();
                ctx.fill();
            },

            finishDrawing() {
                if (this.drawingPoints.length < 3) return;

                // Capture silhouette
                const silhouetteCanvas = document.createElement('canvas');
                silhouetteCanvas.width = 300;
                silhouetteCanvas.height = 300;
                const sCtx = silhouetteCanvas.getContext('2d');
                sCtx.drawImage(this.drawingCanvas, 0, 0);

                // Create lantern on perspective table
                const polygon = this.getTablePolygon();

                // Random position within table polygon (20-80% from left edge)
                const t = 0.2 + Math.random() * 0.6;
                const topEdgeX = polygon[0].x + (polygon[1].x - polygon[0].x) * t;
                const bottomEdgeX = polygon[3].x + (polygon[2].x - polygon[3].x) * t;

                // Random depth on table (30-70% from back to front)
                const depth = 0.3 + Math.random() * 0.4;
                const lanternX = topEdgeX + (bottomEdgeX - topEdgeX) * depth;
                const lanternY = polygon[0].y + (polygon[3].y - polygon[0].y) * depth;

                this.lanterns.push({
                    x: lanternX,
                    y: lanternY - 60, // Offset up so base sits on table
                    rotation: 0,
                    rotationSpeed: 0,
                    silhouette: silhouetteCanvas,
                    height: 100 + Math.random() * 50
                });

                // Close drawing interface
                document.getElementById('drawingInterface').classList.remove('active');

                // Clear drawing
                this.drawingCtx.clearRect(0, 0, 300, 300);
                this.drawingPoints = [];
            },

            animate() {
                this.time += 0.016;

                // Clear
                this.ctx.clearRect(0, 0, this.width, this.height);

                // Render scene
                this.renderRoom();
                this.renderShadows();
                this.renderLanterns();
                this.renderGlowingDot();
                this.renderGlobalLighting();

                // Update physics
                this.updatePhysics();

                requestAnimationFrame(() => this.animate());
            },

            renderRoom() {
                const ctx = this.ctx;

                // Wall (entire background) - flat beige color
                ctx.fillStyle = this.colors.wall;
                ctx.fillRect(0, 0, this.width, this.height);

                // Perspective tabletop polygon
                const polygon = this.getTablePolygon();

                // Main table with gradient (darker at front/bottom, lighter at back)
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                for (let i = 1; i < polygon.length; i++) {
                    ctx.lineTo(polygon[i].x, polygon[i].y);
                }
                ctx.closePath();

                // Vertical gradient for depth
                const tableGradient = ctx.createLinearGradient(
                    0, polygon[0].y,
                    0, polygon[3].y
                );
                tableGradient.addColorStop(0, '#C8BFB0'); // Lighter at back
                tableGradient.addColorStop(0.4, this.colors.table);
                tableGradient.addColorStop(1, '#7A7060'); // Darker at front

                ctx.fillStyle = tableGradient;
                ctx.fill();

                // Edge highlight along the top edge
                ctx.strokeStyle = 'rgba(255, 252, 241, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                ctx.lineTo(polygon[1].x, polygon[1].y);
                ctx.stroke();

                // Soft shadow along left edge for depth
                const leftEdgeGradient = ctx.createLinearGradient(
                    polygon[0].x, 0,
                    polygon[0].x + 60, 0
                );
                leftEdgeGradient.addColorStop(0, 'rgba(0, 0, 0, 0.2)');
                leftEdgeGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                ctx.lineTo(polygon[3].x, polygon[3].y);
                ctx.lineTo(polygon[3].x + 60, polygon[3].y);
                ctx.lineTo(polygon[0].x + 60, polygon[0].y);
                ctx.closePath();
                ctx.fillStyle = leftEdgeGradient;
                ctx.fill();

                ctx.restore();
            },

            renderShadows() {
                const ctx = this.ctx;
                // Wall starts where table ends (right side)
                const wallX = this.width * 0.5;

                // Render all shadows with overlap
                for (let lantern of this.lanterns) {
                    this.renderSingleShadow(lantern, wallX);
                }
            },

            renderSingleShadow(lantern, wallX) {
                const ctx = this.ctx;

                // Shadow position calculation
                // Lantern moves left → shadow moves right (opposite)
                const lanternRelX = lantern.x / (this.width * 0.5);
                const shadowOffsetX = (0.5 - lanternRelX) * 200;
                const shadowX = wallX + 200 + shadowOffsetX;
                const shadowY = this.height * 0.4;

                // Shadow scale (1.8x to 2.2x)
                const shadowScale = 2.0;

                // Use multiply blend mode for darker overlapping shadows
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';

                // Layer 1: Sharp center (very dark)
                ctx.globalAlpha = 0.85;
                ctx.filter = 'blur(50px)';

                ctx.translate(shadowX, shadowY);
                ctx.rotate(lantern.rotation);
                ctx.scale(shadowScale * 0.32, shadowScale * 0.28);
                ctx.translate(-150, -150);

                ctx.drawImage(lantern.silhouette, 0, 0);

                ctx.restore();

                // Layer 2: Medium blur
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.7;
                ctx.filter = 'blur(80px)';

                ctx.translate(shadowX, shadowY);
                ctx.rotate(lantern.rotation);
                ctx.scale(shadowScale * 0.34, shadowScale * 0.29);
                ctx.translate(-150, -150);

                ctx.drawImage(lantern.silhouette, 0, 0);

                ctx.restore();

                // Layer 3: Soft outer glow
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.5;
                ctx.filter = 'blur(120px)';

                ctx.translate(shadowX, shadowY);
                ctx.rotate(lantern.rotation);
                ctx.scale(shadowScale * 0.36, shadowScale * 0.3);
                ctx.translate(-150, -150);

                ctx.drawImage(lantern.silhouette, 0, 0);

                ctx.restore();
            },

            renderLanterns() {
                for (let lantern of this.lanterns) {
                    this.renderDiptyqueLantern(lantern);
                }
            },

            renderDiptyqueLantern(lantern) {
                const ctx = this.ctx;
                const x = lantern.x;
                const y = lantern.y;

                // Contact shadow beneath base (soft, grounded)
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.filter = 'blur(30px)';
                ctx.beginPath();
                ctx.ellipse(x, y + lantern.height + 12, 30, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Candle glow at base (warm light)
                const glowPulse = Math.sin(this.time * 3 + lantern.x * 0.01) * 0.15 + 0.85;
                ctx.save();
                ctx.globalAlpha = 0.3 * glowPulse;
                ctx.filter = 'blur(20px)';
                const glowGradient = ctx.createRadialGradient(x, y + lantern.height - 20, 0, x, y + lantern.height - 20, 50);
                glowGradient.addColorStop(0, '#FFDC53');
                glowGradient.addColorStop(1, 'rgba(255, 220, 83, 0)');
                ctx.fillStyle = glowGradient;
                ctx.fillRect(x - 50, y + lantern.height - 70, 100, 100);
                ctx.restore();

                // Base circle with subtle highlight
                ctx.fillStyle = this.colors.lanternGold;
                ctx.beginPath();
                ctx.arc(x, y + lantern.height, 15, 0, Math.PI * 2);
                ctx.fill();

                // Base highlight (top-left)
                const baseHighlight = ctx.createRadialGradient(x - 5, y + lantern.height - 5, 0, x - 5, y + lantern.height - 5, 12);
                baseHighlight.addColorStop(0, 'rgba(255, 255, 200, 0.4)');
                baseHighlight.addColorStop(1, 'rgba(255, 255, 200, 0)');
                ctx.fillStyle = baseHighlight;
                ctx.beginPath();
                ctx.arc(x, y + lantern.height, 15, 0, Math.PI * 2);
                ctx.fill();

                // Vertical stand
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + lantern.height);
                ctx.lineTo(x, y);
                ctx.stroke();

                // Top circular plate - outer ring with inner shadow
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 50, 0, Math.PI * 2);
                ctx.stroke();

                // Inner darker stroke for depth
                ctx.strokeStyle = 'rgba(200, 160, 30, 0.6)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x, y, 48, 0, Math.PI * 2);
                ctx.stroke();

                // Inner circle detail
                ctx.strokeStyle = this.colors.lanternGold;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 45, 0, Math.PI * 2);
                ctx.stroke();

                // Highlight on upper-left arc of ring
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 200, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 50, Math.PI * 1.2, Math.PI * 1.6);
                ctx.stroke();
                ctx.restore();

                // 6 hanging wires with silhouette charms
                for (let i = 0; i < 6; i++) {
                    const angle = lantern.rotation + (i / 6) * Math.PI * 2;

                    // Offset mounting point to hang inside ring
                    const mountX = x + Math.cos(angle) * 38;
                    const mountY = y + Math.sin(angle) * 38;

                    // Wire hangs down with slight sway
                    const sway = Math.sin(this.time * 1.5 + i) * 2;
                    const charmX = mountX + sway;
                    const charmY = mountY + 60;

                    // Wire
                    ctx.strokeStyle = 'rgba(180, 160, 100, 0.8)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(mountX, mountY);
                    ctx.lineTo(charmX, charmY);
                    ctx.stroke();

                    // Charm (flat black silhouette)
                    ctx.save();
                    ctx.translate(charmX, charmY);
                    ctx.scale(0.08, 0.08);
                    ctx.translate(-150, -150);
                    ctx.drawImage(lantern.silhouette, 0, 0);
                    ctx.restore();
                }
            },

            renderGlowingDot() {
                const ctx = this.ctx;
                const polygon = this.getTablePolygon();
                const x = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const y = polygon[3].y - 40;

                // Pulsating halo
                const pulse = Math.sin(this.time * 2) * 0.5 + 0.5;

                // Outer ripples
                for (let i = 0; i < 3; i++) {
                    const phase = (this.time * 1.5 + i * 0.4) % 1;
                    const radius = 10 + phase * 30;
                    const alpha = (1 - phase) * 0.4;

                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Center dot
                ctx.fillStyle = `rgba(255, 255, 255, ${0.8 + pulse * 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            },

            renderGlobalLighting() {
                const ctx = this.ctx;

                // Warm vignette around entire scene edges
                // Top vignette
                const topVignette = ctx.createLinearGradient(0, 0, 0, 120);
                topVignette.addColorStop(0, 'rgba(40, 30, 20, 0.3)');
                topVignette.addColorStop(1, 'rgba(40, 30, 20, 0)');
                ctx.fillStyle = topVignette;
                ctx.fillRect(0, 0, this.width, 120);

                // Bottom vignette
                const bottomVignette = ctx.createLinearGradient(0, this.height - 120, 0, this.height);
                bottomVignette.addColorStop(0, 'rgba(40, 30, 20, 0)');
                bottomVignette.addColorStop(1, 'rgba(40, 30, 20, 0.3)');
                ctx.fillStyle = bottomVignette;
                ctx.fillRect(0, this.height - 120, this.width, 120);

                // Left vignette
                const leftVignette = ctx.createLinearGradient(0, 0, 100, 0);
                leftVignette.addColorStop(0, 'rgba(40, 30, 20, 0.25)');
                leftVignette.addColorStop(1, 'rgba(40, 30, 20, 0)');
                ctx.fillStyle = leftVignette;
                ctx.fillRect(0, 0, 100, this.height);

                // Right vignette
                const rightVignette = ctx.createLinearGradient(this.width - 100, 0, this.width, 0);
                rightVignette.addColorStop(0, 'rgba(40, 30, 20, 0)');
                rightVignette.addColorStop(1, 'rgba(40, 30, 20, 0.25)');
                ctx.fillStyle = rightVignette;
                ctx.fillRect(this.width - 100, 0, 100, this.height);

                // Radial vignette for corners
                const radialVignette = ctx.createRadialGradient(
                    this.width / 2, this.height / 2, this.height * 0.3,
                    this.width / 2, this.height / 2, this.height * 0.8
                );
                radialVignette.addColorStop(0, 'rgba(40, 30, 20, 0)');
                radialVignette.addColorStop(1, 'rgba(40, 30, 20, 0.2)');
                ctx.fillStyle = radialVignette;
                ctx.fillRect(0, 0, this.width, this.height);
            },

            updatePhysics() {
                for (let lantern of this.lanterns) {
                    // Apply rotation speed and ease to stop
                    lantern.rotation += lantern.rotationSpeed;
                    lantern.rotationSpeed *= 0.94;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
